# Serve SPA under /congat/ on port 9595 (arcade reverse proxy)
# Large channel .raw files (~170MB high-res) need long timeouts + sendfile.

server {
    listen 9595;
    server_name _;

    root /usr/share/nginx/html;

    client_max_body_size 512m;
    client_body_timeout 300s;
    send_timeout 300s;
    keepalive_timeout 65s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # Helpful for large .raw downloads
    output_buffers 2 1m;
    postpone_output 1460;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;
    # Do not gzip huge binary volumes
    gzip_proxied any;

    location = / {
        return 302 /congat/;
    }

    # SPA + static assets built with VITE_BASE_PATH=/congat/
    location /congat/ {
        try_files $uri $uri/ /congat/index.html;
    }

    location /congat/assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # High-res volumes (region selection default)
    location /congat/visualization_data/ {
        try_files $uri =404;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/json json;
            application/octet-stream raw;
        }
        default_type application/octet-stream;
    }

    # Low-res volumes (Low Res toggle)
    location /congat/visualization_data_low/ {
        try_files $uri =404;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/json json;
            application/octet-stream raw;
        }
        default_type application/octet-stream;
    }

    # Very-high-res volumes (Very High Res toggle, ~2.9GB/channel)
    location /congat/visualization_data_very_high/ {
        try_files $uri =404;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/json json;
            application/octet-stream raw;
        }
        default_type application/octet-stream;
    }

    location /congat/VIS2026/ {
        try_files $uri =404;
        add_header Accept-Ranges bytes always;
        types {
            application/json json;
            application/octet-stream raw;
        }
        default_type application/octet-stream;
    }
}
