services:
  congat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /congat/
    image: congat-melanoma:latest
    container_name: congat
    restart: unless-stopped
    ports:
      # Host 9595 → nginx 9595  →  https://arcade.evl.uic.edu/congat
      - "9595:9595"
    volumes:
      # High Res toggle — denser pyramid
      - ./visualization_data:/usr/share/nginx/html/congat/visualization_data:ro
      # Low Res toggle — lighter pyramid
      - ./visualization_data_low:/usr/share/nginx/html/congat/visualization_data_low:ro
      - ./VIS2026/output:/usr/share/nginx/html/congat/VIS2026/output:ro
      - ./VIS2026/Hi_res/HI_res_channel:/usr/share/nginx/html/congat/VIS2026/Hi_res/HI_res_channel:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9595/congat/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
